    />

        "@context": "https://schema.org",

        "applicationCategory": "ScienceApplication",
        "operatingSystem": "Any modern browser",
        "description": "South-pole Sun and Earth window planner for candidate lunar landing regions, with an inspectable terrain horizon and residuals published against NASA JPL Horizons.",

  <body>
    <div id="root"></div>
    <noscript>
      <h1>Selenorizon</h1>
      <p>
        A south-pole window planner: for a candidate lunar landing site and a date, it shows where
        the Sun and Earth sit against the local skyline, which decides solar power and
        direct-to-Earth communications. The tool needs JavaScript because every reading is computed
        in your browser from published solar and lunar position series, checked against NASA JPL
        Horizons to within 0.02 degrees.
      </p>
      <p>
        Sites are published candidate points in NASA's Artemis III candidate regions. The terrain
        horizon is an editable or importable profile of sixteen sector values.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
